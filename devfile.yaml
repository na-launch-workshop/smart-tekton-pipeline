schemaVersion: 2.2.0
metadata:
  name: smart-tekton-pipeline
  description: AI-assisted Tekton pipeline with code review gate
components:
  - name: tools
    container:
      image: registry.redhat.io/ubi9/toolbox:latest
      memoryLimit: 512Mi
      mountSources: true
      endpoints:
        - name: terminal
          targetPort: 7777
          exposure: none
commands:
  - id: apply-pipeline
    exec:
      label: "Apply pipeline to namespace"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "oc apply -f tekton/tasks/ -f tekton/pipeline.yaml"
  - id: run-pipeline
    exec:
      label: "Trigger pipeline run"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "oc create -f tekton/pipelinerun.yaml"
