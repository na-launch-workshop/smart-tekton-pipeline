apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: smart-pipeline-run-
  labels:
    app.kubernetes.io/part-of: smart-pipeline
spec:
  pipelineRef:
    name: smart-pipeline
  params:
    - name: git-url
      value: "https://github.com/na-launch-workshop/smart-tekton-pipeline.git"
    - name: git-revision
      value: "main"
    - name: claude-model
      value: "claude-sonnet-5"
  taskRunTemplate:
    podTemplate:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "smart-pipeline-role"
        vault.hashicorp.com/agent-inject-secret-anthropic: "kv/data/secrets/common/anthropic"
        vault.hashicorp.com/agent-inject-template-anthropic: |
          {{- with secret "kv/data/secrets/common/anthropic" -}}
          {{ .Data.data.api-key }}
          {{- end }}
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
